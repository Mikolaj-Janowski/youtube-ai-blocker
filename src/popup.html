<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>YouTube AI Blocker</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <h2>YouTube AI Blocker</h2>

      <div>
        <label>Mode:</label>
        <select id="mode">
          <option value="local">In-browser (ONNX)</option>
          <option value="remote">Remote (backend)</option>
        </select>
      </div>

      <div id="backendRow" style="margin-top:8px;">
        <label>Backend URL:</label>
        <input id="backendUrl" placeholder="http://localhost:8000" style="width:100%" />
      </div>

      <div style="margin-top:8px;">
        <label>Similarity threshold:</label>
        <div style="display: flex; align-items: center; gap: 8px;">
          <input type="range" id="threshold" min="0.01" max="1.00" step="0.01" style="flex: 1;" />
          <span id="thVal" style="min-width: 45px; font-weight: bold; text-align: right;">0.70</span>
        </div>
      </div>

      <h3>Classifier (Hybrid Mode)</h3>
      <div style="margin-top:8px;">
        <label style="display:flex;align-items:center;gap:8px;">
          <input type="checkbox" id="classifierEnabled" />
          <span>Enable Classifier</span>
        </label>
        <div id="classifierStatus" style="margin-top:8px;font-size:12px;padding:8px;background:#f5f5f5;border-radius:4px;color:#666;">
          Classifier: Not enough data
        </div>
        <button id="retrainClassifier" style="margin-top:8px;padding:6px 12px;">
          Retrain Classifier Now
        </button>
      </div>

      <h3>Blocked Items</h3>
      <div id="blockedList">Loading...</div>
      <button id="clearAll">Clear All Blocks</button>

      <h3>Storage</h3>
      <button id="clearCache">Clear Embedding Cache</button>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
